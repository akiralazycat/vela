name: Assemble Vela v3

on:
  push:
    branches:
      - feat/vela-player-v3

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble generated player source
        run: |
          cat .vela-parts/VelaPlayer.tsx.part00 \
              .vela-parts/VelaPlayer.tsx.part01 \
              .vela-parts/VelaPlayer.tsx.part02 \
              .vela-parts/VelaPlayer.tsx.part03 \
              > components/VelaPlayer.tsx
          rm -rf .vela-parts
      - name: Commit assembled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/VelaPlayer.tsx .vela-parts
          git commit -m "Assemble Vela Player v3 core"
          git push origin HEAD:feat/vela-player-v3
